name: Legion Auto Fix

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Legion CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Run safe auto-fixers
        run: |
          ruff check . --fix
          ruff format .
          python scripts/auto_fix.py

      - name: Run security check helper
        run: |
          python scripts/security_check.py

      - name: Run verification
        run: |
          python -m py_compile main.py core/*.py modules/*.py web/*.py
          ruff check .
          bandit -r . -x venv,.venv,tests
          pytest -q tests

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-fix/${{ github.run_id }}
          title: "Auto-fix Legion CI/security issues"
          body: |
            Automated safe fixes were applied.

            Commands run:
            - ruff check . --fix
            - ruff format .
            - python scripts/auto_fix.py
            - python scripts/security_check.py
            - py_compile
            - ruff check .
            - bandit
            - pytest

            Changed files:
            - repository files modified by safe lint/format/import hygiene steps

            Test results:
            - compile, lint, security scan, and pytest were re-run in workflow

            Warning:
            - Human review is required before merge.
          commit-message: "Auto-fix Legion CI/security issues"
