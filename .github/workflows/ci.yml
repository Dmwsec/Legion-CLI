name: Legion CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Compile check
        run: |
          python -m py_compile main.py core/*.py modules/*.py web/*.py

      - name: Ruff lint
        run: |
          ruff check .

      - name: Bandit security scan
        run: |
          bandit -r . -x venv,.venv,tests

      - name: Tests
        run: |
          pytest -q tests
