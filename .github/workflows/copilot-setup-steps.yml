name: Copilot Setup Steps

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  first_interaction:
    runs-on: ubuntu-latest
    steps:
      - name: First interaction
        uses: actions/first-interaction@v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thanks for opening your first issue in this repository."
          pr-message: "Thanks for opening your first pull request in this repository."
